name: OpenSSF Scorecard

# Thin caller stub; local-path call so this repo exercises the current
# branch. Other repos pin a release tag.

on:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 1'  # Every Monday at 01:30 UTC
  push:
    branches: [main, develop]
  workflow_dispatch:

# security-events:write and id-token:write are required here in the caller
# (reusable workflows can't elevate the caller's token): the analysis job
# requests them for the SARIF upload and the signed OpenSSF publish.
permissions:
  security-events: write
  id-token: write
  contents: read
  actions: read

jobs:
  scorecard:
    uses: ./.github/workflows/reusable-scorecard.yml
