name: Validate (reusable)

# Reusable validate for docs and tooling repos: markdown lint, offline
# internal-link checking, optional shellcheck, conventional-commit lint,
# and a semver bump suggestion. Repos with a language toolchain (services)
# keep a local validate.yml instead; the commit-lint discipline here is
# what branch protection should require everywhere.
#
# Caller stub (in each repo, .github/workflows/validate.yml):
#
#   name: Validate
#   on:
#     push:
#       branches: [main, develop]
#     pull_request:
#       branches: [main, develop]
#   permissions:
#     contents: read
#   jobs:
#     validate:
#       uses: amcheste/gh-workflows/.github/workflows/reusable-validate.yml@v1.1.0
#       with:
#         shellcheck-paths: scripts/*.sh
#
# NOTE: required status checks then become "validate / Lint" and
# "validate / Commit Lint" (rerun /setup-repo to sync the names).

on:
  workflow_call:
    inputs:
      shellcheck-paths:
        description: Space-separated shell globs to shellcheck (empty skips the step)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Markdown lint
        run: npx -y markdownlint-cli2@0.23.0 "**/*.md"

      - name: Shellcheck
        if: inputs.shellcheck-paths != ''
        run: |
          # shellcheck disable=SC2086  # globs are intentionally word-split
          shellcheck ${{ inputs.shellcheck-paths }}

      - name: Internal link check
        uses: lycheeverse/lychee-action@8646ba30535128ac92d33dfc9133794bfdd9b411 # v2.8.0
        with:
          # Offline mode: every relative link, anchor, and image path in the
          # repo must resolve. External URLs are not fetched.
          args: --offline --include-fragments --no-progress --root-dir "${{ github.workspace }}" "**/*.md"
          fail: true

  commit-lint:
    name: Commit Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Check conventional commit format
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          PATTERN='^(feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert)(\([^)]+\))?(!)?: .+'
          FAIL=0

          while IFS= read -r msg; do
            [[ -z "$msg" ]] && continue
            if echo "$msg" | grep -Eq "$PATTERN"; then
              echo "  ✓ $msg"
            else
              echo "  ✗ Non-conventional: $msg"
              FAIL=1
            fi
          done < <(git log --no-merges --format='%s' "${BASE_SHA}..${HEAD_SHA}")

          if [[ $FAIL -eq 1 ]]; then
            echo ""
            echo "Commit messages must follow: <type>[scope][!]: <description>"
            echo "Types: feat fix docs chore refactor test style perf ci build revert"
            exit 1
          fi
          echo "All commit messages are conventional ✓"

      - name: Suggest semver bump
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          BUMP="patch"
          BREAKING=""
          FEATURES=""

          while IFS= read -r msg; do
            [[ -z "$msg" ]] && continue
            if echo "$msg" | grep -Eq '^(feat|fix|docs|chore|refactor|test|style|perf|ci|build|revert)(\([^)]+\))?!: '; then
              BREAKING="$BREAKING\n  - $msg"
              BUMP="major"
            elif echo "$msg" | grep -Eq '^feat(\([^)]+\))?: '; then
              FEATURES="$FEATURES\n  - $msg"
              [[ "$BUMP" != "major" ]] && BUMP="minor"
            fi
          done < <(git log --no-merges --format='%s' "${BASE_SHA}..${HEAD_SHA}")

          {
            case $BUMP in
              major)
                echo "## ⚠️ Suggested bump: \`major\`"
                echo ""
                echo "This PR contains **breaking changes**; increment the major version."
                printf "%b\n" "$BREAKING"
                ;;
              minor)
                echo "## ✨ Suggested bump: \`minor\`"
                echo ""
                echo "This PR adds **new functionality**; increment the minor version."
                printf "%b\n" "$FEATURES"
                ;;
              patch)
                echo "## 🔧 Suggested bump: \`patch\`"
                echo ""
                echo "This PR is a **fix or maintenance** change; increment the patch version."
                ;;
            esac
            echo ""
            echo "Suggested: \`./scripts/bump-version.sh $BUMP\` at release time"
          } | tee -a "$GITHUB_STEP_SUMMARY"
