name: Release Drafter

# Thin caller stub; local-path call so this repo exercises the current
# branch. Other repos pin a release tag. Category/label mapping stays in
# this repo's .github/release-drafter.yml.

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    uses: ./.github/workflows/reusable-release-drafter.yml
