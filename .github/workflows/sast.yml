name: SAST

# Thin caller stub; local-path call so this repo exercises the current
# branch. Other repos pin a release tag. Rule packs: p/secrets is the
# universal floor, p/bash because the reusables embed shell.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 02:00 UTC

permissions:
  contents: read

jobs:
  semgrep:
    uses: ./.github/workflows/reusable-sast.yml
    with:
      semgrep-config: >-
        p/secrets
        p/bash
