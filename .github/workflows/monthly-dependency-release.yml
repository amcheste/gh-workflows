name: Monthly Dependency Release

# Thin caller stub: the logic lives in reusable-monthly-dependency-release.yml
# in this same repo. This repo calls its own reusable by local path, so it
# always runs the version on the current branch; other repos pin a release
# tag (see the reusable's header comment for the stub they use).

on:
  schedule:
    - cron: '0 9 1 * *'  # 1st of each month at 09:00 UTC
  workflow_dispatch:      # manual trigger for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: ./.github/workflows/reusable-monthly-dependency-release.yml
