name: OpenSSF Scorecard (reusable)

# Reusable Scorecard analysis. The Scorecard action only supports the
# default branch, so this job guards push events: a push to any other
# branch (e.g. develop in the two-branch model) is skipped instead of
# failing with "Only the default branch is supported".
#
# Caller stub (in each repo, .github/workflows/scorecard.yml):
#
#   name: OpenSSF Scorecard
#   on:
#     branch_protection_rule:
#     schedule:
#       - cron: '30 1 * * 1'
#     push:
#       branches: [main, develop]
#     workflow_dispatch:
#   permissions:
#     security-events: write
#     id-token: write
#     contents: read
#     actions: read
#   jobs:
#     scorecard:
#       uses: amcheste/gh-workflows/.github/workflows/reusable-scorecard.yml@v1.1.0
#
# security-events:write (SARIF upload to code scanning) and id-token:write
# (signed publish to the OpenSSF REST API) are required in the CALLER: the
# analysis job below requests them, and a reusable workflow can only
# downgrade the caller's token, never elevate it. A caller granting only
# read-all startup-fails before any job runs.

on:
  workflow_call: {}

# Workflow-level must stay minimal: GitHub validates a called workflow's
# workflow-level permissions against the caller's token too, and read-all
# expands to read on every scope — more than the four grants the stub
# makes, so read-all here startup-fails every call. The analysis job
# requests exactly what it needs at job level.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    continue-on-error: true  # Scorecard requires a public repo; fails silently on private repos
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.ref_name == github.event.repository.default_branch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        with:
          sarif_file: results.sarif
