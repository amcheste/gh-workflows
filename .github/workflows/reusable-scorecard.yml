name: OpenSSF Scorecard (reusable)

# Reusable Scorecard analysis. The Scorecard action only supports the
# default branch, so this job guards push events: a push to any other
# branch (e.g. develop in the two-branch model) is skipped instead of
# failing with "Only the default branch is supported".
#
# Caller stub (in each repo, .github/workflows/scorecard.yml):
#
#   name: OpenSSF Scorecard
#   on:
#     branch_protection_rule:
#     schedule:
#       - cron: '30 1 * * 1'
#     push:
#       branches: [main, develop]
#     workflow_dispatch:
#   permissions:
#     security-events: write
#     id-token: write
#     contents: read
#     actions: read
#   jobs:
#     scorecard:
#       uses: amcheste/gh-workflows/.github/workflows/reusable-scorecard.yml@v1.1.0
#
# security-events:write (SARIF upload to code scanning) and id-token:write
# (signed publish to the OpenSSF REST API) are required in the CALLER: the
# analysis job below requests them, and a reusable workflow can only
# downgrade the caller's token, never elevate it. A caller granting only
# read-all startup-fails before any job runs.

on:
  workflow_call: {}

permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    continue-on-error: true  # Scorecard requires a public repo; fails silently on private repos
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.ref_name == github.event.repository.default_branch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e # v4
        if: github.ref_name == github.event.repository.default_branch
        continue-on-error: true
        with:
          sarif_file: results.sarif
