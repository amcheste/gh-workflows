name: Gitleaks

# Thin caller stub: the logic lives in reusable-gitleaks.yml in this same
# repo, called by local path so this repo always exercises its own current
# version. Other repos pin a release tag.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# pull-requests:read is required here in the caller (reusable workflows
# can't elevate the caller's token): gitleaks-action lists the PR's
# commits to compute its scan range.
permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-gitleaks.yml
