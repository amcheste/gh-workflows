name: Gitleaks

# Thin caller stub: the logic lives in reusable-gitleaks.yml in this same
# repo, called by local path so this repo always exercises its own current
# version. Other repos pin a release tag.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ./.github/workflows/reusable-gitleaks.yml
