name: Stale (reusable)

# Reusable issue/PR hygiene: mark inactive items stale after 30 days,
# close after 7 more. Issues labeled pinned or security are exempt so a
# real vulnerability report never auto-closes.
#
# Caller stub (in each repo, .github/workflows/stale.yml):
#
#   name: Stale
#   on:
#     schedule:
#       - cron: '0 9 * * *'
#     workflow_dispatch:
#   permissions:
#     contents: read
#   jobs:
#     stale:
#       uses: amcheste/gh-workflows/.github/workflows/reusable-stale.yml@v1.1.0

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          stale-issue-message: 'This issue has been inactive for 30 days and is marked stale. It will be closed in 7 days unless there is activity.'
          stale-pr-message: 'This PR has been inactive for 30 days and is marked stale. It will be closed in 7 days unless there is activity.'
          close-issue-message: 'Closed due to inactivity.'
          close-pr-message: 'Closed due to inactivity.'
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned'
